version: '3.8'

services:
  # 1. MySQL 資料庫
  db:
    image: mysql:8.0
    container_name: saas_mysql
    restart: always
    environment:
      MYSQL_DATABASE: saas_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: saas_user
      MYSQL_PASSWORD: saas_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # 確保 DB 真的起好才開放連線
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Redis (用於分散式鎖)
  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. RabbitMQ (用於 Celery 異步佇列)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: saas_rabbitmq
    restart: always
    ports:
      - "5672:5672"    # AMQP 協定端口, 這是 RabbitMQ 的資料傳輸通道
      - "15672:15672"  # Web 管理介面端口 (帳密預設: guest / guest)

  # 4. Django API Server 容器
  web:
    build: ./backend
    container_name: saas_django
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MYSQL_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  # 5. Celery Worker 背景任務容器
  celery_worker:
    build: ./backend
    container_name: saas_celery
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - MYSQL_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

volumes:
  mysql_data: